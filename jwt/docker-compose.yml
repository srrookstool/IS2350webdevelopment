version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_server
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Sm5shing
      MYSQL_DATABASE: SamuelDB
      MYSQL_USER: Samuel
      MYSQL_PASSWORD: Sm5shing
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Optional: Uncomment the line below to run initialization scripts on first startup
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data: